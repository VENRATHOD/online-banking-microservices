name: BankPro CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # Java Build
  # ==========================================
  build:
    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - discovery-server
          - auth-service
          - account-service
          - transaction-service
          - api-gateway
          - notification-service

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests


  # ==========================================
  # Docker Build
  # ==========================================
  docker-build:
    name: Build Docker Images

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Discovery Server
        run: docker build -t bankpro-discovery-server:latest ./discovery-server

      - name: Build Auth Service
        run: docker build -t bankpro-auth-service:latest ./auth-service

      - name: Build Account Service
        run: docker build -t bankpro-account-service:latest ./account-service

      - name: Build Transaction Service
        run: docker build -t bankpro-transaction-service:latest ./transaction-service

      - name: Build API Gateway
        run: docker build -t bankpro-api-gateway:latest ./api-gateway

      - name: Build Notification Service
        run: docker build -t bankpro-notification-service:latest ./notification-service