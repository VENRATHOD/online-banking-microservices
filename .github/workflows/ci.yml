name: BankPro CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # Java Build
  # ==========================================
  build:
    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - discovery-server
          - auth-service
          - account-service
          - transaction-service
          - api-gateway
          - notification-service

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests


  # ==========================================
  # Docker Build
  # ==========================================
  docker-build:
    name: Build Docker Images

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build JAR files on the same runner
      # that will build the Docker images.
      - name: Build Discovery Server JAR
        working-directory: discovery-server
        run: mvn clean package -DskipTests

      - name: Build Auth Service JAR
        working-directory: auth-service
        run: mvn clean package -DskipTests

      - name: Build Account Service JAR
        working-directory: account-service
        run: mvn clean package -DskipTests

      - name: Build Transaction Service JAR
        working-directory: transaction-service
        run: mvn clean package -DskipTests

      - name: Build API Gateway JAR
        working-directory: api-gateway
        run: mvn clean package -DskipTests

      - name: Build Notification Service JAR
        working-directory: notification-service
        run: mvn clean package -DskipTests


      # ==========================================
      # Docker
      # ==========================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Discovery Server Docker Image
        run: docker build -t bankpro-discovery-server:latest ./discovery-server

      - name: Build Auth Service Docker Image
        run: docker build -t bankpro-auth-service:latest ./auth-service

      - name: Build Account Service Docker Image
        run: docker build -t bankpro-account-service:latest ./account-service

      - name: Build Transaction Service Docker Image
        run: docker build -t bankpro-transaction-service:latest ./transaction-service

      - name: Build API Gateway Docker Image
        run: docker build -t bankpro-api-gateway:latest ./api-gateway

      - name: Build Notification Service Docker Image
        run: docker build -t bankpro-notification-service:latest ./notification-service