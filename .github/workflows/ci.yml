name: BankPro CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build BankPro Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - discovery-server
          - auth-service
          - account-service
          - transaction-service
          - api-gateway
          - notification-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests