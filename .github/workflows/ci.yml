name: BankPro CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # Java Build
  # ==========================================
  build:
    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - discovery-server
          - auth-service
          - account-service
          - transaction-service
          - api-gateway
          - notification-service

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests


  # ==========================================
  # Docker Build & Push
  # ==========================================
  docker-build:
    name: Build & Push Docker Images

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # Setup Java
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # ==========================================
      # Build JAR files
      # ==========================================

      - name: Build Discovery Server JAR
        working-directory: discovery-server
        run: mvn clean package -DskipTests

      - name: Build Auth Service JAR
        working-directory: auth-service
        run: mvn clean package -DskipTests

      - name: Build Account Service JAR
        working-directory: account-service
        run: mvn clean package -DskipTests

      - name: Build Transaction Service JAR
        working-directory: transaction-service
        run: mvn clean package -DskipTests

      - name: Build API Gateway JAR
        working-directory: api-gateway
        run: mvn clean package -DskipTests

      - name: Build Notification Service JAR
        working-directory: notification-service
        run: mvn clean package -DskipTests


      # ==========================================
      # Setup Docker Buildx
      # ==========================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================
      # Login to Docker Hub
      # ==========================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================
      # Discovery Server
      # ==========================================

      - name: Build Discovery Server Docker Image
        run: docker build -t ven2003/bankpro-discovery-server:latest ./discovery-server

      - name: Push Discovery Server Image
        run: docker push ven2003/bankpro-discovery-server:latest


      # ==========================================
      # Auth Service
      # ==========================================

      - name: Build Auth Service Docker Image
        run: docker build -t ven2003/bankpro-auth-service:latest ./auth-service

      - name: Push Auth Service Image
        run: docker push ven2003/bankpro-auth-service:latest


      # ==========================================
      # Account Service
      # ==========================================

      - name: Build Account Service Docker Image
        run: docker build -t ven2003/bankpro-account-service:latest ./account-service

      - name: Push Account Service Image
        run: docker push ven2003/bankpro-account-service:latest


      # ==========================================
      # Transaction Service
      # ==========================================

      - name: Build Transaction Service Docker Image
        run: docker build -t ven2003/bankpro-transaction-service:latest ./transaction-service

      - name: Push Transaction Service Image
        run: docker push ven2003/bankpro-transaction-service:latest


      # ==========================================
      # API Gateway
      # ==========================================

      - name: Build API Gateway Docker Image
        run: docker build -t ven2003/bankpro-api-gateway:latest ./api-gateway

      - name: Push API Gateway Image
        run: docker push ven2003/bankpro-api-gateway:latest


      # ==========================================
      # Notification Service
      # ==========================================

      - name: Build Notification Service Docker Image
        run: docker build -t ven2003/bankpro-notification-service:latest ./notification-service

      - name: Push Notification Service Image
        run: docker push ven2003/bankpro-notification-service:latest