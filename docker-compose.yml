services:

  # ==========================
  # PostgreSQL
  # ==========================
  postgres:
    image: postgres:18
    container_name: banking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - banking-network
      
 # ==========================
  # kafka
  #==========================
  kafka:
    image: apache/kafka:4.3.1
    container_name: banking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092,HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: CONTROLLER://kafka:9093,DOCKER://kafka:29092,HOST://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - banking-network

  # ==========================
  # Discovery Server
  # ==========================
  discovery-server:
    image: discovery-server:latest
    container_name: discovery-server
    restart: unless-stopped

    ports:
      - "8761:8761"

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - banking-network


  # ==========================
  # Auth Service
  # ==========================
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

    depends_on:
      - postgres
      - discovery-server

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - banking-network


  # ==========================
  # Account Service
  # ==========================
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    image: account-service:latest
    container_name: account-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      - postgres
      - discovery-server
      - redis

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - banking-network

    # ==========================
  # Notification Service
  # ==========================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    image: notification-service:latest
    container_name: notification-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:
      - kafka
      - discovery-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - banking-network


  # ==========================
  # Transaction Service
  # ==========================
  transaction-service:
    image: transaction-service:latest
    container_name: transaction-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

    depends_on:
      - postgres
      - discovery-server

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - banking-network


  # ==========================
  # API Gateway
  # ==========================
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

    depends_on:
      - discovery-server
      - auth-service
      - account-service
      - transaction-service

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - banking-network


  # ==========================
  # Redis
  # ==========================
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    ports:
      - "6379:6379"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
# ==========================
# Network
# ==========================
networks:
  banking-network:
    driver: bridge


# ==========================
# PostgreSQL Volume
# ==========================
volumes:
  postgres_data: